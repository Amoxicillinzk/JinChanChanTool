name: Build AI Coach

on:
  push:
    branches:
      - feat/ai-coach-v1
      - feat/ai-coach-v2-inventory
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SourceCode/JinChanChanTool/JinChanChanTool.csproj

      - name: Publish win-x64
        run: >-
          dotnet publish SourceCode/JinChanChanTool/JinChanChanTool.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o publish

      - name: Package bundled S18 fallback lineup library
        shell: pwsh
        run: |
          $target = "publish/Resources/HeroDatas/S18"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $plain = "SourceCode/JinChanChanTool/Resources/HeroDatas/S18/LineUps.json"
          $packed = "SourceCode/JinChanChanTool/Resources/HeroDatas/S18/LineUps.ai-coach.json.gz.b64"
          if (Test-Path $plain) {
            Copy-Item $plain "$target/LineUps.json" -Force
          } elseif (Test-Path $packed) {
            $base64 = (Get-Content $packed -Raw).Trim()
            $compressed = [Convert]::FromBase64String($base64)
            $input = New-Object System.IO.MemoryStream(,$compressed)
            $gzip = New-Object System.IO.Compression.GZipStream($input, [System.IO.Compression.CompressionMode]::Decompress)
            $reader = New-Object System.IO.StreamReader($gzip, [System.Text.Encoding]::UTF8)
            $json = $reader.ReadToEnd()
            $reader.Dispose(); $gzip.Dispose(); $input.Dispose()
            [System.IO.File]::WriteAllText((Join-Path $target "LineUps.json"), $json, [System.Text.UTF8Encoding]::new($false))
          }

      - name: Package V3
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath JinChanChanTool-AICoach-V3-win-x64.zip -Force

      - name: Upload V3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: JinChanChanTool-AICoach-V3-win-x64
          path: JinChanChanTool-AICoach-V3-win-x64.zip
          retention-days: 14
